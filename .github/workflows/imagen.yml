# Publica las imágenes de Docker en GitHub Container Registry (GHCR) cuando se
# crea una etiqueta de versión (por ejemplo v0.1.0).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Genera dos imágenes:
#   ghcr.io/<dueño>/<repo>:v0.1.0           (la aplicación)
#   ghcr.io/<dueño>/<repo>:v0.1.0-migrate   (aplica las migraciones y termina)
name: Publicar imagen

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre del repositorio en minúsculas.
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Aplicación
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGEN }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGEN }}:${{ github.ref_name }}-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
