# Entorno de produccion. Uso:
#   docker compose --env-file .env.prod -f compose.prod.yaml pull
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d

name: biblioteca

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env.prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${APP_IMAGE:?falta APP_IMAGE en .env.prod}:${APP_TAG:?falta APP_TAG en .env.prod}-migrate
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    image: ${APP_IMAGE}:${APP_TAG}
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'

volumes:
  db_data:
